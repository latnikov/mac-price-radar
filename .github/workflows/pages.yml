name: Deploy Mac Price Radar

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Validate parser and order service
        run: |
          npm test
          npm run test:orders
          npm run typecheck
      - name: Build public artifact
        run: |
          npm run export:public
          mkdir -p dist/web dist/data
          cp web/index.html web/app.js web/retail-analytics.js web/styles.css web/favicon.svg web/favicon-32.png web/apple-touch-icon.png web/og-image.jpg dist/web/
          cp web/404.html web/thank-you.html web/robots.txt web/sitemap.xml dist/
          cp data/public-prices.json dist/data/public-prices.json
          printf '{"mode":"public"}' > dist/web/public-config.json
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=web/"><title>Каталог</title><a href="web/">Открыть каталог</a>' > dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

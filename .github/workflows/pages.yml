name: Deploy Mac Price Radar

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refresh RifaStore prices
        continue-on-error: true
        run: LIVE=1 RETAILER=RifaStore npm run build:data
      - name: Build static site
        run: |
          mkdir -p dist/web dist/data
          cp web/index.html dist/web/index.html
          cp data/cheapest.json dist/data/cheapest.json
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=web/"><title>Mac Price Radar</title><a href="web/">Открыть Mac Price Radar</a>' > dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

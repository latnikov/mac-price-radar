<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mac Price Radar</title><style>body{font:14px system-ui;margin:32px;color:#17202a}table{border-collapse:collapse;width:100%;max-width:1100px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}th{background:#f3f5f7}.best{font-weight:700;color:#087f5b}a{color:inherit}</style><h1>Цены на MacBook</h1><p id="updated"></p><table><thead><tr><th>Конфигурация</th><th>Минимум</th><th>Магазин</th><th>Все предложения</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('../data/cheapest.json').then(r=>r.json()).then(xs=>{rows.innerHTML=xs.map(x=>{let b=x.best;let title=[b.model,b.chip,b.ramGb+' GB',b.storageGb+' GB',b.screenIn?' '+b.screenIn+'"':''].filter(Boolean).join(' ');return `<tr><td>${title}</td><td class="best">${b.price.toLocaleString('ru-RU')} ₽</td><td><a href="${b.url}" target="_blank">${b.retailer}</a></td><td>${x.offers.map(o=>`${o.retailer}: ${o.price.toLocaleString('ru-RU')} ₽`).join('<br>')}</td></tr>`}).join('');updated.textContent='Обновлено: '+new Date().toLocaleString('ru-RU')})</script></html>

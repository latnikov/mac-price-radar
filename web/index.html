<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mac Price Radar</title><style>:root{font:14px system-ui;color:#17202a}body{margin:24px;background:#fff}h1{margin:0 0 8px}.toolbar{display:flex;gap:12px;align-items:center;margin:12px 0 18px}button{padding:9px 14px;border:1px solid #b9c0c8;border-radius:7px;background:#17202a;color:#fff;cursor:pointer}button:disabled{opacity:.6}#status{color:#66717c}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1200px}th,td{padding:9px 10px;border-right:1px solid #dfe3e8;border-bottom:1px solid #dfe3e8;vertical-align:middle}th{background:#f3f5f7;position:sticky;top:0;z-index:1}.model{font-weight:600;min-width:250px}.store{text-align:center;min-width:120px}.price a{color:#087f5b;font-weight:700;text-decoration:none}.lowest{background:#e9f8ef}.lowest a{color:#087f5b;font-weight:800}.empty{color:#9aa3ad}.ours{background:#fff8df}.scroll{overflow:auto;border:1px solid #dfe3e8}small{display:block;color:#66717c;font-weight:400}</style><h1>Цены на MacBook</h1><div class="toolbar"><button id="refresh">Обновить ценники</button><span id="status"></span></div><div class="scroll"><table><thead><tr><th>Модель / конфигурация</th><th>Цвет</th><th class="store lowest">Самая низкая цена<small>магазин</small></th><th class="store">BigGeek<small>цена</small></th><th class="store">Айфория<small>цена</small></th><th class="store">Technichno<small>цена</small></th><th class="store">RifaStore<small>цена</small></th><th class="store ours">Наши поставщики<small>цена</small></th></tr></thead><tbody id="rows"></tbody></table></div><script>const stores=['BigGeek','Айфория','Technichno','RifaStore','Наши поставщики'];const fmt=n=>n==null?'—':n.toLocaleString('ru-RU')+' ₽';const cell=o=>o?.price==null?'<span class="empty">—</span>':`<a href="${o.url}" target="_blank" rel="noreferrer">${fmt(o.price)}</a>`;function render(xs){rows.innerHTML=xs.map(x=>{const p=x.product;const offer=s=>x.offers.find(o=>o.retailer===s);const best=x.offers[0];return `<tr><td class="model">${p.name}<small>${p.chip} · ${p.ramGb} GB · ${p.storageGb} GB</small></td><td>${x.color}</td><td class="price lowest">${best?`${cell(best)}<small>${best.retailer}</small>`:'<span class="empty">—</span>'}</td>${stores.map(s=>`<td class="price ${s==='Наши поставщики'?'ours':''}">${cell(offer(s))}</td>`).join('')}</tr>`}).join('');status.textContent=`Обновлено: ${new Date().toLocaleString('ru-RU')} · ${xs.length} строк каталога`;}async function load(){const r=await fetch('../data/cheapest.json?ts='+Date.now());render(await r.json())}refresh.onclick=async()=>{refresh.disabled=true;status.textContent='Обновляю ценники…';try{await fetch('../refresh',{method:'POST'}).catch(()=>{});await load()}finally{refresh.disabled=false}};load();</script></html>
